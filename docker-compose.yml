# ─────────────────────────────────────────────────────────────────────────────
# VecDB — Docker Compose (Development Stack)
#
# Services:
#   vecdb-server  — FastAPI backend on :8088
#   dashboard     — React/Vite frontend on :5173
#
# NOTE: Both services run in development mode (hot-reload enabled).
# For production deployment, build the dashboard with `npm run build`
# and serve the static dist/ via nginx or a CDN instead.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── VecDB REST API Server ────────────────────────────────────────────────
  vecdb-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vecdb-server
    ports:
      - "8088:8088"
    volumes:
      # Persist vector data, WAL logs, and snapshots across container restarts
      - vecdb-data:/app/vdb_data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── React/Vite Dashboard (DEV mode — hot reload enabled) ─────────────────
  # NOTE: This runs `npm run dev -- --host` which is intentionally the Vite
  # development server. It provides HMR (hot module replacement) for fast
  # iteration. Do NOT use this mode for a public-facing deployment.
  dashboard:
    image: node:20-alpine
    container_name: vecdb-dashboard
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      # Mount the dashboard source so Vite picks up live edits
      - ./dashboard:/app:cached
      # Isolate node_modules inside the container to avoid host conflicts
      - /app/node_modules
    environment:
      # Tell the dashboard which API host to connect to.
      # Inside Docker, services communicate via service names on the shared network.
      - VITE_API_BASE=http://vecdb-server:8088
    depends_on:
      vecdb-server:
        condition: service_healthy
    restart: unless-stopped


# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  vecdb-data:
    driver: local


# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  default:
    name: vecdb-network
